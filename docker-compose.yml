# Default: `docker compose up -d`       → pulls prebuilt image from GHCR
# Build locally: `docker compose up -d --build` → builds from Dockerfile

services:
  bot:
    image: ghcr.io/leitosama/tg-bot-boilerplate:latest
    build:
      context: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
