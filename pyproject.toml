[project]
name = "tg-bot-boilerplate"
version = "0.1.0"
description = "Telegram bot boilerplate: Docker/SQLite (polling) + Cloudflare Workers/D1 (webhook)"
requires-python = ">=3.12"
dependencies = [
    "pyTelegramBotAPI>=4.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "workers-py",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["bot", "storage", "local"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["telebot.*", "workers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
